name: Sleepless
options:
  bundleIdPrefix: net.fornace
  deploymentTarget:
    macOS: '14.0'
targets:
  Sleepless:
    type: application
    platform: macOS
    sources:
      - path: Sleepless
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fornace.sleepless
        PRODUCT_NAME: Sleepless
        SWIFT_VERSION: '6.0'
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: '-'
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sleepless
        INFOPLIST_KEY_NSHumanReadableCopyright: ''
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
